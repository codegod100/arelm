##
## Reindeer config for arelm's Cargo.toml.
##
## Vendors + buckifies Cargo.lock's transitive dependency graph (relm4 and
## everything it pulls in - gtk4-rs / libadwaita bindings, the underlying
## -sys crates, etc.) into third-party/BUCK as native rust_library targets,
## replacing
## `cargo build`/`cargo run` with real buck2 targets for both the desktop
## dev flow and (via a second platform below) the Android cross build.
##
## Re-run `reindeer vendor` (if Cargo.lock changed) then `reindeer buckify`
## after any Cargo.toml/Cargo.lock edit - third-party/BUCK is generated,
## not hand-maintained.
third_party_dir = "third-party"

# Cargo.toml lives at the repo root (next to this file), not inside
# third_party_dir - without this, reindeer defaults manifest_path to
# `third_party_dir/Cargo.toml` (its usual layout assumption, where the
# vendored crates and the manifest describing them live in the same
# subdirectory) and fails with "third-party/Cargo.toml is not a file".
manifest_path = "Cargo.toml"

# Several -sys crates here (glib-sys, gtk4-sys, cairo-sys-rs, pango-sys,
# gdk-pixbuf-sys, ...) build.rs's use `env!("CARGO_PKG_*")`-style
# compile-time access; buck2's generated rules don't set those by default.
cargo_env = true

# Host desktop platform: links against the system's own GTK4 via
# pkg-config (see meson.build's comment on the same dual-mode trick - this
# is the buck2 equivalent). Matches what `cargo run` used before.
[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"

# Android cross platforms: link against pixiewood's own from-source,
# per-arch GTK4 build instead of the system one - see fixups/*/fixup.toml
# for the crates that need PKG_CONFIG_PATH repointed at
# .pixiewood/bin-<arch>/meson-uninstalled (pixiewood must have already run
# `prepare`+enough of `build` for that arch's GTK to exist there; see
# README.md).
[platform.android-aarch64]
target = "aarch64-linux-android"

[platform.android-x86_64]
target = "x86_64-linux-android"

[buck]
file_name = "BUCK"
